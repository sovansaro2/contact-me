name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # អនុញ្ញាតឱ្យចុច Run ដោយផ្ទាល់ដៃពីលើ GitHub

jobs:
  build-ios:
    name: Build iOS with Xcode on macOS
    runs-on: macos-14 # ប្រើប្រាស់ macOS Runner របស់ GitHub

    steps:
      # ជំហានទី ១: ទាញយកកូដពី Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ជំហានទី ២: រៀបចំ Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # ជំហានទី ៣: ដំឡើង Dependencies ទាំងអស់
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ជំហានទី ៤: Build Web Assets (PWA)
      - name: Build Web Application
        run: npm run build

      # ជំហានទី ៥: បង្កើត និង Sync iOS Platform
      - name: Setup iOS with Capacitor
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      # ជំហានទី ៦: Compile ជាមួយ Xcode (Unsigned Release Build)
      - name: Compile iOS Project with Xcode
        run: |
          cd ios/App
          echo "=== ពិនិត្យឯកសារក្នុង ios/App ==="
          ls -la

          # រកមើលថាតើគម្រោងប្រើ App.xcworkspace ឬ App.xcodeproj
          if [ -d "App.xcworkspace" ]; then
            echo "រកឃើញ App.xcworkspace (CocoaPods)"
            TARGET_FLAG="-workspace App.xcworkspace"
          elif [ -d "App.xcodeproj" ]; then
            echo "រកឃើញ App.xcodeproj (Swift Package Manager)"
            TARGET_FLAG="-project App.xcodeproj"
          else
            echo "❌ មិនមាន Project ឬ Workspace ឡើយ"
            exit 1
          fi

          # បិទការទាមទារ Apple Developer Signing ដោយស្វ័យប្រវត្តិក្នុង Xcode project
          if [ -f "App.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj || true
            sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' App.xcodeproj/project.pbxproj || true
            sed -i '' 's/DevelopmentTeam = "[^"]*";/DevelopmentTeam = "";/g' App.xcodeproj/project.pbxproj || true
          fi

          xcodebuild build \
            $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      # ជំហានទី ៧: វេចខ្ចប់ជាឯកសារ IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          echo "រកឃើញ App នៅត្រង់: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ រកមិនឃើញឯកសារ .app ដែលបាន compile រួចទេ"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r App-iOS.ipa Payload

      # ជំហានទី ៨: បង្ហោះ IPA សម្រាប់ទាញយក (Download Artifact)
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: App-iOS.ipa
          retention-days: 14
