name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # អនុញ្ញាតឱ្យចុច Run ដោយផ្ទាល់ដៃពីលើ GitHub

jobs:
  build-ios:
    name: Build iOS with Xcode on macOS
    runs-on: macos-14 # ប្រើប្រាស់ macOS Runner របស់ GitHub

    steps:
      # ជំហានទី ១: ទាញយកកូដពី Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ជំហានទី ២: រៀបចំ Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # ជំហានទី ៣: ដំឡើង Dependencies ទាំងអស់
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ជំហានទី ៤: Build Web Assets (PWA)
      - name: Build Web Application
        run: npm run build

      # ជំហានទី ៥: បង្កើត និង Sync iOS Platform
      - name: Setup iOS with Capacitor
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      # ជំហានទី ៦: Compile ជាមួយ Xcode (Unsigned Release Build)
      - name: Compile iOS Project with Xcode
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ជំហានទី ៧: វេចខ្ចប់ជាឯកសារ IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App-iOS.ipa Payload

      # ជំហានទី ៨: បង្ហោះ IPA សម្រាប់ទាញយក (Download Artifact)
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: App-iOS.ipa
          retention-days: 14
