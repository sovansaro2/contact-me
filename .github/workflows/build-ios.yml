name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # អនុញ្ញាតឱ្យចុច Run ដោយផ្ទាល់ដៃពីលើ GitHub

jobs:
  build-ios:
    name: Build iOS with Xcode on macOS
    runs-on: macos-14 # ប្រើ macOS ចុងក្រោយបង្អស់របស់ GitHub

    steps:
      # ជំហានទី ១: ទាញយកកូដពី Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ជំហានទី ២: រៀបចំ Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ជំហានទី ៣: ដំឡើង Dependencies ទាំងអស់ (រួមទាំង @capacitor/ios)
      - name: Install NPM Dependencies
        run: |
          npm ci || npm install
          npm install @capacitor/ios@8.0.3

      # ជំហានទី ៤: Build Web Assets
      - name: Build Web Application
        run: npm run build

      # ជំហានទី ៥: បង្កើត និង Sync ចូល Folder iOS
      - name: Capacitor Add & Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      # ជំហានទី ៦: Compile ជាមួយ Xcode (No-code-signing for development testing)
      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ជំហានទី ៧: វេចខ្ចប់ Archive & Payload ចេញជា IPA / ZIP
      - name: Package App
        run: |
          mkdir -p build_output/Payload
          cp -r ios/App/App.xcarchive/Products/Applications/App.app build_output/Payload/
          cd build_output
          zip -r App-iOS.ipa Payload
          zip -r App-iOS.xcarchive.zip ../ios/App/App.xcarchive

      # ជំហានទី ៨: Upload File App សម្រាប់ឱ្យអ្នកទាញយក (Download Artifact)
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Build
          path: |
            build_output/App-iOS.ipa
            build_output/App-iOS.xcarchive.zip
          retention-days: 14
